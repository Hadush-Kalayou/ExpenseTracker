{% extends "base.html" %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h3>

                        <i class="bi bi-cash-stack"></i>

                        {{ title }}

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">

                                Income Source

                            </label>

                            {{ form.source }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Category

                            </label>

                            {{ form.category }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Amount

                            </label>

                            {{ form.amount }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Date

                            </label>

                            {{ form.date }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Description

                            </label>

                            {{ form.description }}

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'expense:income_list' %}"
                               class="btn btn-secondary">

                                Back

                            </a>

                            <button class="btn btn-success">

                                Save Income

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
